<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
      color: #ffffff;
    }

    .container {
      background-color: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 450px;
      text-align: center;
    }

    h1 {
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }

    .input-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .time-input {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-input label {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 4px;
    }

    input[type="number"], input[type="text"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }

    input[type="number"] {
      width: 70px;
    }

    input[type="text"] {
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .timer-display {
      font-size: 3.5rem;
      font-weight: bold;
      font-family: monospace;
      margin: 1rem 0;
    }

    .progress-bar-container {
      width: 100%;
      height: 16px;
      background-color: #333;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      transition: width 1s linear, background-color 1s linear;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .pulsing {
      animation: pulse 1s infinite;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      transition: background-color 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.reset {
      background-color: #f44336;
    }

    .end-message {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffeb3b;
      margin-top: 1rem;
      word-break: break-word;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Ekran Konfiguracji -->
    <div id="config-screen">
      <h1>Ustaw Timer</h1>
      <div class="input-group">
        <div class="time-input">
          <input type="number" id="hours" min="0" max="99" value="0">
          <label>Godz.</label>
        </div>
        <div class="time-input">
          <input type="number" id="minutes" min="0" max="59" value="0">
          <label>Min.</label>
        </div>
        <div class="time-input">
          <input type="number" id="seconds" min="0" max="59" value="15">
          <label>Sek.</label>
        </div>
      </div>
      <input type="text" id="message-input" placeholder="Wiadomość po zakończeniu (opcjonalnie)">
      <button id="start-btn">Start</button>
    </div>

    <!-- Ekran Odliczania -->
    <div id="timer-screen" class="hidden">
      <div class="timer-display" id="display">00:00:00</div>
      
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="controls">
        <button id="pause-btn">Pauza</button>
        <button id="reset-btn" class="reset">Reset</button>
      </div>

      <div id="end-message" class="end-message hidden"></div>
    </div>
  </div>

  <script>
    let totalSeconds = 0;
    let initialSeconds = 0;
    let timerInterval = null;
    let isPaused = false;

    const configScreen = document.getElementById('config-screen');
    const timerScreen = document.getElementById('timer-screen');
    const display = document.getElementById('display');
    const progressBar = document.getElementById('progress-bar');
    const endMessage = document.getElementById('end-message');

    const hoursInput = document.getElementById('hours');
    const minutesInput = document.getElementById('minutes');
    const secondsInput = document.getElementById('seconds');
    const messageInput = document.getElementById('message-input');

    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resetBtn = document.getElementById('reset-btn');

    function formatTime(sec) {
      const h = Math.floor(sec / 3600).toString().padStart(2, '0');
      const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function getColor(ratio) {
      // ratio: 1.0 (start, biały) -> 0.0 (koniec, czerwony)
      if (ratio > 0.66) {
        // Biały do Żółtego
        const factor = (1 - ratio) / 0.34;
        const blue = Math.round(255 * (1 - factor));
        return `rgb(255, 255, ${blue})`;
      } else if (ratio > 0.33) {
        // Żółty do Pomarańczowego
        const factor = (0.66 - ratio) / 0.33;
        const green = Math.round(255 - (127 * factor));
        return `rgb(255, ${green}, 0)`;
      } else {
        // Pomarańczowy do Czerwonego
        const factor = (0.33 - ratio) / 0.33;
        const green = Math.round(128 * (1 - factor));
        return `rgb(255, ${green}, 0)`;
      }
    }

    function updateTimer() {
      display.textContent = formatTime(totalSeconds);
      
      const ratio = initialSeconds > 0 ? totalSeconds / initialSeconds : 0;
      progressBar.style.width = `${ratio * 100}%`;
      progressBar.style.backgroundColor = getColor(ratio);

      if (totalSeconds <= 10 && totalSeconds > 0) {
        progressBar.classList.add('pulsing');
      } else {
        progressBar.classList.remove('pulsing');
      }

      if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        progressBar.classList.remove('pulsing');
        progressBar.style.width = '0%';
        pauseBtn.classList.add('hidden');
        
        if (messageInput.value.trim() !== '') {
          endMessage.textContent = messageInput.value;
          endMessage.classList.remove('hidden');
        }
      }
    }

    startBtn.addEventListener('click', () => {
      const h = parseInt(hoursInput.value) || 0;
      const m = parseInt(minutesInput.value) || 0;
      const s = parseInt(secondsInput.value) || 0;

      totalSeconds = h * 3600 + m * 60 + s;
      initialSeconds = totalSeconds;

      if (totalSeconds <= 0) return;

      configScreen.classList.add('hidden');
      timerScreen.classList.remove('hidden');
      endMessage.classList.add('hidden');
      pauseBtn.classList.remove('hidden');
      pauseBtn.textContent = 'Pauza';
      isPaused = false;

      updateTimer();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isPaused) {
          totalSeconds--;
          updateTimer();
        }
      }, 1000);
    });

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Wznów' : 'Pauza';
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(timerInterval);
      timerScreen.classList.add('hidden');
      configScreen.classList.remove('hidden');
    });
  </script>
</body>
</html>
