      body {

        overflow-x: hidden;
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
      @keyframes secondPulseAnimation {
        0%, 100% {
          filter: brightness(1) drop-shadow(0 0 4px rgba(232, 19, 16, 0.3));
          opacity: 1;
          transform: scaleY(1);
        }
        50% {
          filter: brightness(1.8) drop-shadow(0 0 20px rgba(232, 19, 16, 0.9));
          opacity: 0.45;
          transform: scaleY(1.08);
        }
      }
      .pulse-second {
        animation: secondPulseAnimation 1s ease-in-out infinite;
      }
      @keyframes finishPop {
        0% { opacity: 0; transform: scale(0.92); }
        50% { transform: scale(1.04); }
        100% { opacity: 1; transform: scale(1); }
      }
      .animate-finish-pop {
        animation: finishPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      const COLOR_STOPS = [
        { p: 1.0, r: 255, g: 255, b: 255 },
        { p: 0.66, r: 250, g: 204, b: 21 },
        { p: 0.33, r: 249, g: 115, b: 22 },
        { p: 0.0, r: 232, g: 19, b: 16 }
      ];

      function getInterpolatedColor(fraction) {
        const clamped = Math.max(0, Math.min(1, fraction));
        for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
          const higher = COLOR_STOPS[i];
          const lower = COLOR_STOPS[i + 1];
          if (clamped <= higher.p && clamped >= lower.p) {
            const range = higher.p - lower.p;
            const t = range === 0 ? 0 : (clamped - lower.p) / range;
            const r = Math.round(lower.r + (higher.r - lower.r) * t);
            const g = Math.round(lower.g + (higher.g - lower.g) * t);
            const b = Math.round(lower.b + (higher.b - lower.b) * t);
            return `rgb(${r}, ${g}, ${b})`;
          }
        }
        return 'rgb(232, 19, 16)';
      }

      function parseUrlParams() {
        if (typeof window === 'undefined') return { hours: 0, minutes: 5, seconds: 0, msg: null };

        const h = parseInt(params.get('h') || '0', 10);
        const m = parseInt(params.get('m') || '0', 10);
        const s = parseInt(params.get('s') || '0', 10);
        const msg = params.get('msg');
        const hasTimeParam = params.has('h') || params.has('m') || params.has('s');
        return {
          hours: isNaN(h) || h < 0 ? 0 : Math.min(99, h),
          minutes: isNaN(m) || m < 0 ? 0 : Math.min(59, m),
          seconds: isNaN(s) || s < 0 ? 0 : Math.min(59, s),
          msg: msg ? decodeURIComponent(msg) : null,
          hasParams: hasTimeParam || params.has('msg')
        };

      // =========================================================================
      // GŁÓWNY STAN APLIKACJI
      // =========================================================================
      const initialUrlParams = parseUrlParams();

      const state = {
        screen: 'setup', // 'setup' | 'running' | 'finished'
        language: localStorage.getItem('app_lang') || 'pl',
        theme: localStorage.getItem('app_theme') || 'dark',
        soundEnabled: localStorage.getItem('app_sound') !== 'false',

        loadedFromUrlNotice: initialUrlParams.hasParams,
        totalMs: 0,
        remainingMs: 0,
        isRunning: false,
        bgImage: localStorage.getItem('app_bg_image') || null,
        bgEnabled: localStorage.getItem('app_bg_enabled') !== 'false',
        bgOpacity: (() => {
          const saved = localStorage.getItem('app_bg_opacity');
          if (saved !== null) {
            const parsed = parseInt(saved, 10);
            if (!isNaN(parsed) && parsed >= 0 && parsed <= 100) {
              return Math.max(0, Math.min(100, Math.round(parsed / 20) * 20));
            }
          }
          return 100;
        })(),
        headerVisible: true,
        toastMessage: null
      };

      let animationFrameId = null;
      let endTimeRef = 0;
      let lastSecondBeep = -1;
      let audioContext = null;
      let toastTimer = null;
      let mouseIdleTimer = null;
      let countdownStartTimer = null;

      // Sync document theme class
      function syncDocumentTheme() {
        if (state.theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.body.className = 'min-h-screen bg-black text-zinc-100 antialiased selection:bg-amber-500 selection:text-black transition-colors duration-300 relative overflow-x-hidden';
        } else {
          document.documentElement.classList.remove('dark');
          document.body.className = 'min-h-screen bg-zinc-100 text-zinc-900 antialiased selection:bg-amber-500 selection:text-black transition-colors duration-300 relative overflow-x-hidden';
        }
      }

      // Sync HTML lang attribute
      function syncDocumentLang() {
        document.documentElement.lang = state.language;
      }

      // Get translation helper
      function getT() {
        return TRANSLATIONS[state.language] || TRANSLATIONS.pl;
      }

      function showToast(msg) {
        state.toastMessage = msg;
        render();
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          if (state.toastMessage === msg) {
            state.toastMessage = null;
            render();
          }
        }, 3200);
      }

      // Web Audio API Beeps
      function getAudioContext() {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioContext = new AudioCtx();
        }
        if (audioContext && audioContext.state === 'suspended') {
          audioContext.resume();
        }
        return audioContext;
      }

      function playBeep(freq = 880, durationMs = 120, type = 'sine') {
        if (!state.soundEnabled) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + durationMs / 1000);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + durationMs / 1000);
        } catch (e) {
          console.warn(e);
        }
      }

      function playEndAlarm() {
        if (!state.soundEnabled) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            playBeep(freq, 250, 'triangle');
          }, idx * 160);
        });
      }

      // Format time parts
      function formatTimeParts(ms) {
        const totalSec = Math.max(0, Math.ceil(ms / 1000));
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return {
          hoursStr: String(h).padStart(2, '0'),
          minutesStr: String(m).padStart(2, '0'),
          secondsStr: String(s).padStart(2, '0'),
          hasHours: h > 0,
          rawSeconds: totalSec,
        };
      }

      // Timer Engine
      function stopTimerAnimation() {
        if (animationFrameId !== null) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
      }

      function startTimerAnimation() {
        stopTimerAnimation();

        function tick() {
          const now = Date.now();
          const diff = Math.max(0, endTimeRef - now);
          state.remainingMs = diff;

          const currentSec = Math.ceil(diff / 1000);
          if (currentSec > 0 && currentSec <= 5 && currentSec !== lastSecondBeep) {
            lastSecondBeep = currentSec;
            playBeep(880, 100);
          }

          if (diff <= 0) {
            state.remainingMs = 0;
            state.isRunning = false;
            state.screen = 'finished';
            playEndAlarm();
            render();
            return;
          }

          renderRunningTimeOnly();
          animationFrameId = requestAnimationFrame(tick);
        }

        animationFrameId = requestAnimationFrame(tick);
      }

      function handleStartCountdown() {
        const calculatedTotalMs = (state.hours * 3600 + state.minutes * 60 + state.seconds) * 1000;
        if (calculatedTotalMs <= 0) {
          showToast(getT().toastTimeZero);
          return;
        }
        state.totalMs = calculatedTotalMs;
        state.remainingMs = calculatedTotalMs;
        state.isRunning = true;
        state.screen = 'running';
        endTimeRef = Date.now() + calculatedTotalMs;
        lastSecondBeep = -1;

        startTimerAnimation();
        setupHeaderAutoHide();
        render();
      }

      function handleTogglePause() {
        if (state.isRunning) {
          state.isRunning = false;
          stopTimerAnimation();
          state.headerVisible = true;
        } else {
          state.isRunning = true;
          endTimeRef = Date.now() + state.remainingMs;
          startTimerAnimation();
          setupHeaderAutoHide();
        }
        render();
      }

      function handleResetToSetup() {
        state.isRunning = false;
        stopTimerAnimation();
        state.screen = 'setup';
        state.remainingMs = 0;
        state.headerVisible = true;
        render();
      }

      function handleRestartSame() {
        state.remainingMs = state.totalMs;
        state.isRunning = true;
        state.screen = 'running';
        endTimeRef = Date.now() + state.totalMs;
        lastSecondBeep = -1;

        startTimerAnimation();
        setupHeaderAutoHide();
        render();
      }

      function setupHeaderAutoHide() {
        if (countdownStartTimer) clearTimeout(countdownStartTimer);
        if (mouseIdleTimer) clearTimeout(mouseIdleTimer);

        if (state.screen === 'running' && state.isRunning) {
          countdownStartTimer = setTimeout(() => {
            state.headerVisible = false;
            render();
          }, 3000);
        }
      }

      window.addEventListener('mousemove', () => {
        if (state.screen === 'running' && state.isRunning) {
          if (!state.headerVisible) {
            state.headerVisible = true;
            render();
          }
          if (mouseIdleTimer) clearTimeout(mouseIdleTimer);
          mouseIdleTimer = setTimeout(() => {
            if (state.screen === 'running' && state.isRunning) {
              state.headerVisible = false;
              render();
            }
          }, 3000);
        }
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          return;
        }
        if (e.code === 'Space') {
          e.preventDefault();
          if (state.screen === 'running') {
            handleTogglePause();
          } else if (state.screen === 'setup') {
            handleStartCountdown();
          } else if (state.screen === 'finished') {
            handleRestartSame();
          }
        } else if (e.code === 'KeyF') {
          e.preventDefault();
          toggleFullscreen();
        }
      });

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => {
            state.isFullscreen = true;
            render();
          }).catch(err => console.warn(err));
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().then(() => {
              state.isFullscreen = false;
              render();
            }).catch(err => console.warn(err));
          }
        }
      }

      document.addEventListener('fullscreenchange', () => {
        state.isFullscreen = !!document.fullscreenElement;
        render();
      });

      // Actions & Handlers
      function handleShareLink() {
        const t = getT();
        const baseUrl = window.location.origin + window.location.pathname;
        const params = new URLSearchParams();
        if (state.hours > 0) params.set('h', String(state.hours));
        if (state.minutes > 0) params.set('m', String(state.minutes));
        if (state.seconds > 0) params.set('s', String(state.seconds));
        if (state.endMessage && state.endMessage !== 'Czas upłynął' && state.endMessage !== 'Time is up') {
          params.set('msg', encodeURIComponent(state.endMessage));
        }
        const fullUrl = `${baseUrl}?${params.toString()}`;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullUrl);
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = fullUrl;
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
          }
          showToast(t.toastCopied);
        } catch {
          showToast(t.toastCopyFailed);
        }
      }

      function handleLanguageChange(newLang) {
        if (newLang === state.language) return;
        state.language = newLang;
        localStorage.setItem('app_lang', newLang);
        if (newLang === 'en' && state.endMessage === 'Czas upłynął') {
          state.endMessage = 'Time is up';
        } else if (newLang === 'pl' && state.endMessage === 'Time is up') {

      function handleBgOpacityChange(val) {
        const clamped = Math.max(0, Math.min(100, Math.round(val / 20) * 20));
        state.bgOpacity = clamped;
        try {
          localStorage.setItem('app_bg_opacity', String(clamped));
        } catch (err) {
          console.warn(err);
        }
        render();
      }

      function handleBgFileChange(file) {
        const t = getT();
        if (!file) return;
        if (!file.type.match(/^image\/(jpeg|jpg|png|webp)$/i) && !file.name.match(/\.(jpe?g|png|webp)$/i)) {
          showToast(t.toastBgInvalid);
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          const rawData = event.target?.result;
          if (!rawData) {
            showToast(t.toastBgSizeError);
            return;
          }

          const img = new Image();
          img.onload = () => {
            const maxW = 1920;
            const maxH = 1080;
            let w = img.width;
            let h = img.height;

            if (w > maxW || h > maxH) {
              if (w / maxW > h / maxH) {
                h = Math.round((h * maxW) / w);
                w = maxW;
              } else {
                w = Math.round((w * maxH) / h);
                h = maxH;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.drawImage(img, 0, 0, w, h);
              try {
                const compressed = canvas.toDataURL('image/jpeg', 0.86);
                state.bgImage = compressed;
                state.bgEnabled = true;
                handleBgOpacityChange(100);
                localStorage.setItem('app_bg_image', compressed);
                localStorage.setItem('app_bg_enabled', 'true');
                localStorage.setItem('app_bg_opacity', '100');
                showToast(t.toastBgUploaded);
              } catch {
                state.bgImage = rawData;
                state.bgEnabled = true;
                handleBgOpacityChange(100);
                showToast(t.toastBgUploaded);
              }
            }
            render();
          };
          img.src = rawData;
        };
        reader.readAsDataURL(file);
      }

      // Fast DOM update for active timer tick
      function renderRunningTimeOnly() {
        const svgText = document.getElementById('svg-timer-text');
        const svgContainer = document.getElementById('svg-timer-container');
        const progressBarInner = document.getElementById('progress-bar-inner');
        const unitsHoursLabel = document.getElementById('unit-hours-label');
        if (!svgText || !progressBarInner) {
          render();
          return;
        }

        const timeInfo = formatTimeParts(state.remainingMs);
        const progressFraction = state.totalMs > 0 ? state.remainingMs / state.totalMs : 0;
        const progressBarColor = getInterpolatedColor(progressFraction);
        const isLast10Seconds = timeInfo.rawSeconds <= 10 && timeInfo.rawSeconds > 0;

        const timeStr = timeInfo.hasHours
          ? `${timeInfo.hoursStr}:${timeInfo.minutesStr}:${timeInfo.secondsStr}`
          : `${timeInfo.minutesStr}:${timeInfo.secondsStr}`;

        svgText.textContent = timeStr;
        if (svgContainer) {
          svgContainer.setAttribute('viewBox', timeInfo.hasHours ? "0 0 780 160" : "0 0 520 160");
        }

        if (isLast10Seconds) {
          svgText.parentElement.setAttribute('class', 'w-full h-auto transition-colors select-none text-[#e81310]');
          progressBarInner.setAttribute('class', `h-full rounded-full transition-all duration-200 ${state.isRunning ? 'pulse-second' : ''}`);
          progressBarInner.style.boxShadow = '0 0 16px rgba(232, 19, 16, 0.8)';
        } else {
          svgText.parentElement.setAttribute('class', `w-full h-auto transition-colors select-none ${state.theme === 'dark' ? 'text-zinc-100' : 'text-zinc-900'}`);
          progressBarInner.setAttribute('class', 'h-full rounded-full transition-all duration-200');
          progressBarInner.style.boxShadow = `0 0 10px ${progressBarColor}40`;
        }

        progressBarInner.style.width = `${Math.max(1, progressFraction * 100)}%`;
        progressBarInner.style.backgroundColor = progressBarColor;

        if (unitsHoursLabel) {
          unitsHoursLabel.style.display = timeInfo.hasHours ? 'inline' : 'none';
        }
      }

          <!-- Toast notification -->
          ${state.toastMessage ? `
            <div class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl shadow-2xl border text-xs sm:text-sm font-semibold transition-all transform animate-bounce ${state.theme === 'dark' ? 'bg-zinc-900 text-zinc-100 border-zinc-700' : 'bg-zinc-900 text-white border-zinc-800'}">
              ${state.toastMessage}
            </div>
          ` : ''}
        `;

        document.getElementById('app').innerHTML = appHtml;
        bindEvents();
      }

      // Bind DOM Event Listeners after rendering HTML
      function bindEvents() {
        const getEl = id => document.getElementById(id);

        if (getEl('btn-sound-toggle')) getEl('btn-sound-toggle').onclick = handleSoundToggle;
        if (getEl('btn-fullscreen-toggle')) getEl('btn-fullscreen-toggle').onclick = toggleFullscreen;
        if (getEl('btn-theme-toggle')) getEl('btn-theme-toggle').onclick = handleThemeToggle;
        if (getEl('btn-share-link')) getEl('btn-share-link').onclick = handleShareLink;

        if (getEl('btn-lang-pl')) getEl('btn-lang-pl').onclick = () => handleLanguageChange('pl');
        if (getEl('btn-lang-en')) getEl('btn-lang-en').onclick = () => handleLanguageChange('en');

        if (getEl('btn-toggle-bg-header')) getEl('btn-toggle-bg-header').onclick = handleToggleBg;
        if (getEl('btn-toggle-pause-header')) getEl('btn-toggle-pause-header').onclick = handleTogglePause;
        if (getEl('btn-reset-header')) getEl('btn-reset-header').onclick = handleResetToSetup;

        if (getEl('btn-close-notice')) getEl('btn-close-notice').onclick = () => {
          state.loadedFromUrlNotice = false;
          render();
        };

        // Setup screen inputs
        if (getEl('hours-input')) {
          const inp = getEl('hours-input');
          inp.onchange = (e) => {
            const val = parseInt(e.target.value, 10);
            state.hours = isNaN(val) ? 0 : Math.max(0, Math.min(99, val));
            render();
          };
        }
        if (getEl('minutes-input')) {
          const inp = getEl('minutes-input');
          inp.onchange = (e) => {
            const val = parseInt(e.target.value, 10);
            state.minutes = isNaN(val) ? 0 : Math.max(0, Math.min(59, val));
            render();
          };
        }
        if (getEl('seconds-input')) {
          const inp = getEl('seconds-input');
          inp.onchange = (e) => {
            const val = parseInt(e.target.value, 10);
            state.seconds = isNaN(val) ? 0 : Math.max(0, Math.min(59, val));
            render();
          };
        }

        if (getEl('btn-hours-dec')) getEl('btn-hours-dec').onclick = () => { state.hours = Math.max(0, state.hours - 1); render(); };
        if (getEl('btn-hours-inc')) getEl('btn-hours-inc').onclick = () => { state.hours = Math.min(99, state.hours + 1); render(); };
        if (getEl('btn-hours-reset')) getEl('btn-hours-reset').onclick = () => { state.hours = 0; render(); };

        if (getEl('btn-minutes-dec')) getEl('btn-minutes-dec').onclick = () => { state.minutes = Math.max(0, state.minutes - 1); render(); };
        if (getEl('btn-minutes-inc')) getEl('btn-minutes-inc').onclick = () => { state.minutes = Math.min(59, state.minutes + 1); render(); };
        if (getEl('btn-minutes-reset')) getEl('btn-minutes-reset').onclick = () => { state.minutes = 0; render(); };

        if (getEl('btn-seconds-dec')) getEl('btn-seconds-dec').onclick = () => { state.seconds = Math.max(0, state.seconds - 1); render(); };
        if (getEl('btn-seconds-inc')) getEl('btn-seconds-inc').onclick = () => { state.seconds = Math.min(59, state.seconds + 1); render(); };
        if (getEl('btn-seconds-reset')) getEl('btn-seconds-reset').onclick = () => { state.seconds = 0; render(); };

        // Presets & Add buttons
        document.querySelectorAll('.btn-preset').forEach(btn => {
          btn.onclick = () => {
            const h = parseInt(btn.dataset.presetH, 10);
            const m = parseInt(btn.dataset.presetM, 10);
            const s = parseInt(btn.dataset.presetS, 10);
            const label = btn.dataset.presetLabel;
            state.hours = h;
            state.minutes = m;
            state.seconds = s;
            showToast(`${getT().toastPreset} ${label}`);
            render();
          };
        });

        document.querySelectorAll('.btn-add-h').forEach(btn => {
          btn.onclick = () => {
            state.hours = Math.min(99, state.hours + parseInt(btn.dataset.addH, 10));
            render();
          };
        });

        document.querySelectorAll('.btn-add-m').forEach(btn => {
          btn.onclick = () => {
            state.minutes = Math.min(59, state.minutes + parseInt(btn.dataset.addM, 10));
            render();
          };
        });

        document.querySelectorAll('.btn-add-s').forEach(btn => {
          btn.onclick = () => {
            state.seconds = Math.min(59, state.seconds + parseInt(btn.dataset.addS, 10));
            render();
          };
        });

        // Final message input
        if (getEl('end-message')) {
          const inp = getEl('end-message');
          inp.oninput = (e) => {
            state.endMessage = e.target.value;
            const counter = getEl('end-msg-counter');
            if (counter) counter.textContent = `${state.endMessage.length}/100`;
          };
        }

        // Custom Background upload & controls
        if (getEl('btn-upload-file')) {
          getEl('btn-upload-file').onclick = () => {
            const fileInput = getEl('file-bg-input');
            if (fileInput) fileInput.click();
          };
        }

        if (getEl('file-bg-input')) {
          getEl('file-bg-input').onchange = (e) => {
            const file = e.target.files?.[0];
            if (file) handleBgFileChange(file);
          };
        }

        if (getEl('btn-toggle-bg')) getEl('btn-toggle-bg').onclick = handleToggleBg;
        if (getEl('btn-remove-bg')) getEl('btn-remove-bg').onclick = handleRemoveBg;

        if (getEl('bg-opacity-slider')) {
          getEl('bg-opacity-slider').onchange = (e) => {
            handleBgOpacityChange(parseInt(e.target.value, 10));
          };
          getEl('bg-opacity-slider').oninput = (e) => {
            handleBgOpacityChange(parseInt(e.target.value, 10));
          };
        }

        document.querySelectorAll('.btn-step-opacity').forEach(btn => {
          btn.onclick = () => {
            handleBgOpacityChange(parseInt(btn.dataset.stepVal, 10));
          };
        });

        if (getEl('btn-start-countdown')) getEl('btn-start-countdown').onclick = handleStartCountdown;

        // Finished screen buttons
        if (getEl('btn-finished-reset')) getEl('btn-finished-reset').onclick = handleResetToSetup;
        if (getEl('btn-finished-restart')) getEl('btn-finished-restart').onclick = handleRestartSame;
      }

      // Initial Render
      render();
    </script>
  </body>
</html>
